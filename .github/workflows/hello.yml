on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: npm install --legacy-peer-deps

      - run: make test

      - uses: hexlet-components/hello-from-hexlet-action@release
